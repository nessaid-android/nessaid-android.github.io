<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} - Nessaid Android Studio</title>
<meta name="description" content="{{SHORT}}">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/catalog.js" defer></script>
<script src="/assets/js/site.js" defer></script>
</head>
<body data-product="{{SLUG}}" data-page="overview">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"><div class="wrap bar"><a class="brand" href="/">Nessaid Android Studio</a></div></header>

<main id="main" class="page wrap">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol><li><a href="/">Home</a></li><li><a href="/{{SECTION}}/">{{SECTION_TITLE}}</a></li><li aria-current="page">{{NAME}}</li></ol>
  </nav>

  <!-- Icon, name, tagline and status come from catalog.js. The h1 is here
       too, so the page still has its title without JavaScript. -->
  <div data-product-hero><h1>{{NAME}}</h1></div>
  <nav data-product-subnav></nav>

  <div class="product-layout">
    <article>
      <!-- LONG:START -->
      <p class="lede">{{SHORT}}</p>

      <h2>About {{NAME}}</h2>
      <p>Long description goes here.</p>

      <h2>Features</h2>
      <ul class="features">
        <li>Feature</li>
      </ul>
      <!-- LONG:END -->

      <!-- Screenshots: uncomment and add files under /assets/img/{{SECTION}}/{{SLUG}}/
      <h2>Screenshots</h2>
      <div class="screens">
        <img src="/assets/img/{{SECTION}}/{{SLUG}}/1.png" alt="Describe what the screen shows">
      </div>
      -->

      <!-- A promo video: set the YouTube video ID.
      <h2>See it in action</h2>
      <div class="yt" data-yt="VIDEO_ID" data-title="{{NAME}} in one minute"></div>
      -->
    </article>

    <aside data-product-aside></aside>
  </div>
</main>

<footer id="site-footer"></footer>
</body>
</html>
